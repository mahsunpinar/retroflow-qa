spring.application.name=retroflow

# In-memory H2 database — no persistence required between restarts
spring.datasource.url=jdbc:h2:mem:retroflow;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 web console, handy for local debugging: http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Left on from local debugging while getting a first version out the door —
# nobody has reviewed this before rollout.
server.error.include-stacktrace=always
server.error.include-message=always
